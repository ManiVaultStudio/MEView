<!doctype html>
<html>

<head>
  <title>Trace View</title>
  <meta content="utf-8" http-equiv="encoding">

  <!-- CSS -->
  <link rel="stylesheet" type="text/css" href="../utils/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="cellcard.css">

  <!-- Libraries (defer keeps order and waits for DOM) -->
  <script defer src="../utils/d3@7.js"></script>

  <!-- Qt web channel must be before the code that uses it -->
  <script defer src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script defer src="../utils/qwebchannel.tools.js"></script>

  <!-- Plot and communication functions -->
  <script defer src="cellcard.js"></script>
  <script defer src="ap_view.js"></script>
  <!-- <script defer src="spinner.js"></script> -->
</head>

<body>
  <div class="container-fluid">
    <div class="row mt-3">
        <div class="identity">
            <p class="meta">
                Cell ID <strong><label id="cellIdLabel">832577255</label></strong> • Type <strong><label id="clusterLabel">L4 IT_1</label></strong><br/>
                Cell Name <strong><label id="cellNameLabel">CellName</label></strong><br/>
                Stim Type <strong><label id="stimTypeLabel">StimType</label></strong> • Stim Desc <strong><label id="stimDescLabel">StimDesc</label></strong>
            </p>
        </div>
        <div class="d-flex flex-column">
          <div class="d-flex align-items-center gap-2">
            <span class="sweep-label">Select sweep:</span>
            <div id="sweepPalette" class="sweep-palette" aria-label="Select sweep"></div>
          </div>

          <!-- Dynamic info line -->
          <div id="sweepInfo" class="sweep-info"></div>
        </div>
    </div>

    <div class="row">
      <div class="col-auto p-0" id="traceDiv"></div>
    </div>
    
    <div class="row">
      <div class="col-12 p-0">
        <div id="ap_container" class="ap-container">
          <div id="ap_graph" class="ap-panel"></div>
          <div id="phase_graph" class="ap-panel"></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
